server:
  port: 9000

spring:
  application:
    name: cloud-app
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

cloud:
  security:
    jwt:
      secret: cloud-demo-jwt-signing-secret-min-32-bytes-required-for-hs256-xx
      issuer: cloud-auth
      access-token-ttl-seconds: 7200
  app:
    archive:
      upload-dir: ./data/archives
      max-file-size: 10485760
  business:
    demo:
      data-dir: ./data/demo

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
